<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10 Dias Até Seu Primeiro Encontro — Episódio 2</title>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1a1a;--green:#3ee36b;--red:#e8483b;--yel:#ffd93b;--bg:#15121c}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Nunito,system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.stage{position:relative;aspect-ratio:9/16;height:min(100dvh,calc(100vw*16/9));overflow:hidden;background:#000;border-radius:14px;container-type:size;box-shadow:0 10px 40px #0008}
.cam{position:absolute;inset:0;transform-origin:50% 38%;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.cam.cut{transition:none}
svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.paused *, .paused *::before,.paused *::after{animation-play-state:paused!important}
/* HUD */
.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:3cqw 3cqw;z-index:30;pointer-events:none}
.hb{background:#0d0f14e6;border:.5cqw solid #2c3a30;border-radius:2.2cqw;padding:1.6cqw 3cqw;min-width:30cqw;box-shadow:0 .8cqw 0 #000a}
.hb small{display:block;font:900 2.8cqw Nunito,sans-serif;letter-spacing:.06em;color:#b9f5c8}
.hb b{font:400 9cqw 'Luckiest Guy',Impact,sans-serif;color:var(--green);line-height:1;text-shadow:0 0 3cqw #3ee36b66}
.hb.r{text-align:right}
.hb.r b{color:#fff}
.gbar{height:2.2cqw;background:#1e2a22;border:.4cqw solid #3ee36b;border-radius:2cqw;margin-top:1cqw;overflow:hidden;position:relative}
.gbar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--green)}
/* Captions */
.capt{position:absolute;left:4%;right:4%;bottom:12%;text-align:center;z-index:25;font:400 10cqw/1.05 'Luckiest Guy',Impact,sans-serif;color:#fff;-webkit-text-stroke:1.6cqw #000;paint-order:stroke fill;text-shadow:0 1.2cqw 0 #000;animation:capin .35s cubic-bezier(.3,1.6,.5,1) both}
.capt.top{bottom:auto;top:20%}
.capt em{font-style:normal;color:var(--yel)}
.capt.red{color:#ff5a4a}.capt.green{color:var(--green)}.capt.big{font-size:13cqw}
@keyframes capin{0%{transform:scale(.3) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
/* Phone */
.phone{position:absolute;left:12%;right:12%;top:20%;height:54%;z-index:26;background:#f3f4f8;border:1.4cqw solid #111;border-radius:7cqw;overflow:hidden;box-shadow:0 3cqw 0 #0007;animation:phin .4s cubic-bezier(.3,1.5,.5,1) both;display:flex;flex-direction:column}
@keyframes phin{0%{transform:translateY(120%) rotate(8deg)}100%{transform:none}}
.ph-head{background:#fff;display:flex;align-items:center;gap:2.5cqw;padding:5cqw 3cqw 2.5cqw;border-bottom:.4cqw solid #ddd;color:#222}
.ph-head svg{width:10cqw;height:10cqw}
.ph-head b{font-size:4.2cqw;display:block}.ph-head small{font-size:2.8cqw;color:#2a9c4a}
.msgs{flex:1;padding:3cqw;display:flex;flex-direction:column;gap:2.5cqw;justify-content:flex-end;background:#e9e3f3}
.msg{max-width:85%;padding:2.4cqw 3.2cqw;border-radius:4cqw;font:800 3.8cqw/1.25 Nunito,sans-serif;color:#222;animation:capin .3s cubic-bezier(.3,1.6,.5,1) both;box-shadow:0 .6cqw 0 #0002}
.msg.l{background:#fff;align-self:flex-start;border-bottom-left-radius:1cqw}
.msg.r{background:#b8f3c6;align-self:flex-end;border-bottom-right-radius:1cqw}
.phone.dark{background:#0a0a0e}
.phone.dark .reflect{flex:1;display:flex;align-items:center;justify-content:center;opacity:.55;filter:grayscale(.4) brightness(.9)}
.phone.dark .reflect svg{width:90%}
.phone.dark::after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,#fff2 0 30%,transparent 30% 45%,#fff1 45% 52%,transparent 52%)}
/* Flash & shake */
.flash{position:absolute;inset:0;background:#fff;z-index:40;pointer-events:none;animation:fl .25s both}
@keyframes fl{from{opacity:.9}to{opacity:0}}
.shake{animation:shk .4s}
@keyframes shk{20%{transform:translate(-2%,1%)}40%{transform:translate(2%,-1%)}60%{transform:translate(-1%,-1%)}80%{transform:translate(1%,1%)}}
/* SVG anims */
.tb{transform-box:fill-box;transform-origin:center bottom}
.vb{transform-box:view-box}
.bob{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.5%)}}
.walk{animation:walk .45s ease-in-out infinite}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4%) rotate(2deg)}}
.eat{animation:eat 1.4s ease-in-out infinite}
@keyframes eat{0%,100%{transform:rotate(-40deg)}50%{transform:rotate(-125deg)}}
.hairfix{animation:hairfix .5s ease-in-out infinite}
@keyframes hairfix{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-170deg)}}
.tug{animation:tug .4s ease-in-out infinite}
@keyframes tug{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(-5deg)}}
.lookdown{animation:ld 2s ease-in-out both}
@keyframes ld{to{transform:rotate(8deg) translateY(3%)}}
.headshake{animation:hs .3s ease-in-out 4}
@keyframes hs{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.pop{animation:pop .45s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.scroll{animation:scroll 6s linear both}
@keyframes scroll{to{transform:translateX(-360px)}}
.flyin{animation:flyin .7s cubic-bezier(.4,0,.6,1) both}
@keyframes flyin{0%{transform:translate(-150px,-120px) rotate(-200deg) scale(.6);opacity:0}20%{opacity:1}100%{transform:none}}
.flyout{animation:flyout .7s ease-in both}
@keyframes flyout{to{transform:translate(-170px,-260px) rotate(300deg);opacity:0}}
.twinkle{animation:tw 1s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.3;transform:scale(.7)}}
.steam{animation:st 1.6s ease-in-out infinite}
@keyframes st{0%{opacity:0;transform:translateY(0)}50%{opacity:.8}100%{opacity:0;transform:translateY(-20px)}}
.burst{animation:spin 8s linear infinite;transform-origin:180px 300px}
@keyframes spin{to{transform:rotate(360deg)}}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;text-align:center;font:400 15cqw/.95 'Luckiest Guy',Impact,sans-serif;color:#fff;-webkit-text-stroke:2cqw #000;paint-order:stroke fill;text-shadow:0 1.8cqw 0 #000}
.title span{display:block;animation:capin .5s cubic-bezier(.3,1.7,.5,1) both}
.title span:nth-child(2){color:var(--yel);font-size:20cqw;animation-delay:.25s}
.title span:nth-child(3){animation-delay:.5s}
/* Vote */
.vote{position:absolute;inset:0;z-index:28;display:grid;grid-template-columns:1fr 1fr;background:#000}
.opt{position:relative;overflow:hidden;cursor:pointer;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:filter .3s, transform .3s;font:inherit;padding:0}
.opt:focus-visible{outline:1.2cqw solid var(--yel);outline-offset:-1.2cqw}
.opt.a{background:radial-gradient(circle at 50% 50%,#ff6b5a,#b81d1d)}
.opt.b{background:radial-gradient(circle at 50% 50%,#58e67d,#167a35)}
.opt svg{width:100%;flex:none}
.opt .lab{position:absolute;bottom:35%;left:0;right:0;font:400 11cqw/1 'Luckiest Guy',Impact,sans-serif;-webkit-text-stroke:1.5cqw #000;paint-order:stroke fill;text-shadow:0 1cqw 0 #000}
.opt .desc{position:absolute;bottom:31%;left:0;right:0;font:900 3.3cqw Nunito,sans-serif;text-shadow:0 .4cqw 0 #000}
.vote.chosen .opt:not(.sel){filter:grayscale(.85) brightness(.55)}
.opt.sel{animation:selp .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes selp{40%{transform:scale(1.05)}}
.opt.sel::after{content:"✓";position:absolute;top:36%;right:6%;width:12cqw;height:12cqw;border-radius:50%;background:var(--yel);color:#000;border:1cqw solid #000;display:grid;place-items:center;font:400 8cqw 'Luckiest Guy',sans-serif;animation:pop .4s cubic-bezier(.3,1.7,.5,1) both}
.vs{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);z-index:3;font:400 22cqw/1 'Luckiest Guy',Impact,sans-serif;color:#fff;-webkit-text-stroke:2.4cqw #000;paint-order:stroke fill;text-shadow:0 1.6cqw 0 #000;pointer-events:none;animation:xpulse 1s ease-in-out infinite}
@keyframes xpulse{50%{transform:translate(-50%,-50%) scale(1.12) rotate(6deg)}}
.vtop{position:absolute;top:17%;left:3%;right:3%;z-index:3;text-align:center;pointer-events:none}
.vtop .c1{display:inline-block;background:var(--yel);color:#000;border:.8cqw solid #000;border-radius:3cqw;padding:1cqw 4cqw;font:400 7cqw 'Luckiest Guy',Impact,sans-serif;box-shadow:0 1cqw 0 #000;animation:xpulse2 1.2s ease-in-out infinite}
@keyframes xpulse2{50%{transform:scale(1.06)}}
.vtop .c2{margin-top:2cqw;font:400 6.2cqw/1.05 'Luckiest Guy',Impact,sans-serif;-webkit-text-stroke:1.2cqw #000;paint-order:stroke fill;text-shadow:0 .8cqw 0 #000}
.vbot{position:absolute;bottom:3%;left:3%;right:3%;z-index:3;text-align:center;pointer-events:none}
.vbot .d1{font:400 6.4cqw/1.05 'Luckiest Guy',Impact,sans-serif;-webkit-text-stroke:1.2cqw #000;paint-order:stroke fill;text-shadow:0 .8cqw 0 #000}
.vbot .d2{font:400 9cqw/1 'Luckiest Guy',Impact,sans-serif;color:var(--yel);-webkit-text-stroke:1.5cqw #000;paint-order:stroke fill;text-shadow:0 1cqw 0 #000;margin-top:1cqw}
.voted{margin-top:1.5cqw;display:inline-block;background:#000c;border:.5cqw solid var(--yel);border-radius:3cqw;padding:1cqw 3cqw;font:900 3.3cqw Nunito,sans-serif;min-height:1em}
.voted:empty{display:none}
.conf{position:absolute;width:2.4cqw;height:3.4cqw;z-index:5;pointer-events:none;animation:conf 1.1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
/* Start screen */
.start{position:absolute;inset:0;z-index:50;background:radial-gradient(circle at 50% 45%,#5b3fa8,#1a1030);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;text-align:center}
.start .t{font:400 11cqw/.95 'Luckiest Guy',Impact,sans-serif;-webkit-text-stroke:1.6cqw #000;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #000}
.start .t em{font-style:normal;color:var(--yel);font-size:16cqw;display:block}
.start .ep{font:900 4cqw Nunito,sans-serif;color:#cfc3ff}
.start svg{width:52cqw}
.playbtn{font:400 9cqw 'Luckiest Guy',Impact,sans-serif;background:var(--green);color:#000;border:1cqw solid #000;border-radius:5cqw;padding:2cqw 9cqw;box-shadow:0 1.6cqw 0 #000;cursor:pointer}
.playbtn:active{transform:translateY(1cqw);box-shadow:0 .6cqw 0 #000}
.playbtn:focus-visible{outline:4px solid #fff}
/* Controls */
.ctrl{display:flex;align-items:center;gap:8px;width:min(100vw - 16px,calc((100dvh - 70px)*9/16));min-width:300px;background:#221d2c;border-radius:12px;padding:6px 10px}
.ctrl button{background:#3a3248;color:#fff;border:none;border-radius:8px;width:36px;height:36px;font-size:16px;cursor:pointer;flex:none}
.ctrl button:focus-visible,.ctrl input:focus-visible,.prog:focus-visible{outline:2px solid var(--green)}
.prog{flex:1;height:10px;background:#3a3248;border-radius:6px;position:relative;cursor:pointer}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:6px;width:0}
.time{font:700 12px Nunito,sans-serif;color:#cfc8dc;min-width:72px;text-align:center}
.vol{width:64px;accent-color:#3ee36b}
@media (prefers-reduced-motion:reduce){.vs,.vtop .c1{animation:none}}
/* ===== Episódio 2 ===== */
.hb.r.lit{border-color:var(--green);box-shadow:0 0 6cqw #3ee36baa,0 .8cqw 0 #000a;animation:xpulse2 .5s ease-in-out infinite}
.stamp{position:absolute;left:50%;top:44%;z-index:30;transform:translate(-50%,-50%) rotate(-10deg);font:400 20cqw/1 'Luckiest Guy',Impact,sans-serif;color:var(--yel);-webkit-text-stroke:2.4cqw #000;paint-order:stroke fill;text-shadow:0 1.6cqw 0 #000;animation:stampin .5s cubic-bezier(.3,1.7,.5,1) both}
@keyframes stampin{0%{transform:translate(-50%,-50%) scale(3) rotate(-30deg);opacity:0}100%{transform:translate(-50%,-50%) rotate(-10deg);opacity:1}}
.vote.tie .vs{display:none}
.vote.tie .opt{animation:selp .6s cubic-bezier(.3,1.7,.5,1)}
.ban{position:absolute;left:5%;right:5%;top:17%;z-index:27;text-align:center;background:#0d0f14e6;border:.6cqw solid var(--green);border-radius:3cqw;padding:2cqw;font:400 7cqw/1 'Luckiest Guy',Impact,sans-serif;color:var(--green);animation:capin .35s cubic-bezier(.3,1.6,.5,1) both}
.ban small{font:900 3.4cqw Nunito,sans-serif;color:#b9f5c8;vertical-align:middle}
.ban.go{background:var(--yel);color:#000;border-color:#000;box-shadow:0 1cqw 0 #000;font-size:6.4cqw}
.diag{position:absolute;left:7%;right:7%;top:17%;z-index:26;background:#fff;color:#1a1a1a;border:1.2cqw solid #111;border-radius:5cqw;padding:3cqw 4cqw;box-shadow:0 2.4cqw 0 #0007;animation:phin .4s cubic-bezier(.3,1.5,.5,1) both}
.diag .dh{font:400 6cqw 'Luckiest Guy',Impact,sans-serif;color:#1d9c94;text-align:center}
.diag .dsm svg{display:block;width:62%;margin:1cqw auto}
.diag ol{list-style:none;display:flex;flex-direction:column;gap:1.6cqw;margin-top:1cqw}
.diag li{display:flex;align-items:center;gap:2.4cqw;font:900 4.6cqw/1.1 Nunito,sans-serif;animation:capin .35s cubic-bezier(.3,1.6,.5,1) both}
.diag li b{flex:none;width:8cqw;height:8cqw;border-radius:50%;background:var(--yel);border:.6cqw solid #000;display:grid;place-items:center;font:400 5cqw 'Luckiest Guy',sans-serif}
.diag .dnote{margin-top:2cqw;font:800 3.2cqw Nunito,sans-serif;color:#555;text-align:center}
.diag.ok{border-color:#1d9c94}
.diag.ok li b{background:var(--green)}
.closeup{position:absolute;left:8%;right:8%;top:30%;z-index:26;background:#fff;border:1.2cqw solid #111;border-radius:50%/40%;padding:4cqw 3cqw;box-shadow:0 2cqw 0 #0007;animation:phin .35s cubic-bezier(.3,1.5,.5,1) both}
.closeup svg{display:block;width:100%}
.closeup.glowy{box-shadow:0 0 10cqw #fff8,0 2cqw 0 #0007;border-color:var(--green)}
.closeup .plan{position:absolute;left:-6%;right:-6%;top:104%;text-align:center;background:var(--yel);border:.7cqw solid #000;border-radius:3cqw;padding:1.4cqw 2cqw;font:400 4.2cqw/1.15 'Luckiest Guy',Impact,sans-serif;color:#000;animation:capin .4s .2s both}
.closeup .plan b{color:#e8483b}
.clk{position:absolute;left:50%;top:22%;z-index:27;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1cqw;animation:capin .35s cubic-bezier(.3,1.6,.5,1) both}
.clk svg{width:34cqw;filter:drop-shadow(0 1.4cqw 0 #000)}
.clk span{font:400 7cqw 'Luckiest Guy',Impact,sans-serif;-webkit-text-stroke:1.2cqw #000;paint-order:stroke fill;white-space:nowrap}
.clk .hand{transform-origin:50px 50px;transform-box:view-box}
.clk .fast{animation:spin .5s linear infinite}.clk .slow{animation:spin 6s linear infinite}
.clk.spin .fast{animation-duration:.15s}.clk.spin .slow{animation-duration:1.8s}
.clk.timer{left:auto;right:4%;top:28%;transform:none}.clk.timer svg{width:20cqw}
.wipe{position:absolute;inset:0;z-index:35;background:repeating-linear-gradient(135deg,var(--yel) 0 6cqw,#fff 6cqw 12cqw);animation:wipe .8s ease-in-out both;pointer-events:none}
@keyframes wipe{0%{transform:translateX(-110%)}45%,55%{transform:none}100%{transform:translateX(110%)}}
.flop{animation:flop .7s cubic-bezier(.5,0,.6,1.4) both;transform-box:view-box;transform-origin:180px 600px}
@keyframes flop{to{transform:translate(110px,-80px) rotate(-78deg)}}
.walkin{animation:walkin 1.6s ease-out both}
@keyframes walkin{from{transform:translateX(220px)}}
.phone.zoom{animation:phzoom .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes phzoom{to{transform:scale(1.18)}}
.msg .pic{display:block;width:34cqw;background:#fff;border-radius:2cqw;padding:1cqw}
.msg .pic svg{display:block;width:100%}
.spk{position:absolute;z-index:29;font:400 9cqw sans-serif;color:#fff;text-shadow:0 0 3cqw #ffe36b,0 0 1cqw #fff;animation:tw .5s ease-in-out infinite alternate}
.spk.sm{font-size:6cqw}
.gbig{position:absolute;left:50%;top:40%;z-index:31;transform:translate(-50%,-50%);text-align:center;font:400 11cqw/1 'Luckiest Guy',Impact,sans-serif;color:#fff;-webkit-text-stroke:1.8cqw #000;paint-order:stroke fill;text-shadow:0 1.4cqw 0 #000;animation:stampin .55s cubic-bezier(.3,1.7,.5,1) both;white-space:nowrap}
.gbig b{display:block;font-size:26cqw;color:var(--green);text-shadow:0 1.6cqw 0 #000,0 0 8cqw #3ee36b}
.opt.b{background:radial-gradient(circle at 50% 50%,#58e67d,#167a35)}
</style>
</head>
<body>
<div class="wrap">
<div class="stage" id="stage">
  <div class="cam" id="cam"><div id="layer" style="position:absolute;inset:0"></div></div>
  <div class="hud" id="hud">
    <div class="hb"><small>DIAS RESTANTES</small><b id="hudDays">9</b></div>
    <div class="hb r" id="hudGlowBox"><small>GLOW UP</small><b id="hudGlow">0%</b><div class="gbar"><i id="hudBar"></i></div></div>
  </div>
  <div id="fx"></div>
</div>
</div>

<script>
/* ===========================================================
   ÁUDIO EXTERNO (opcional): quando tiver os arquivos de
   narração gravados, coloque os caminhos aqui. Se ficar vazio,
   o episódio usa a voz sintética pt-BR do navegador.
   =========================================================== */
const NARRACAO_ARQUIVOS = [ // coloque aqui os MP3 da narração, um por cena (0–17)
'',
'',

// Narração contínua do episódio (uma fala por cena)
const NARRACAO_TEXTO = [
  "Vocês não conseguiram decidir! Dentes e quarto empataram. Então o Roberto vai ter que encarar as duas missões de uma vez!",
  "Nove dias... até o encontro!",
  "Pois é... o Roberto queria escolher só uma missão, mas vocês decidiram que ele precisava fazer as duas.",
  "Primeiro, vamos resolver uma situação que já estava passando dos limites: o sorriso do Roberto. Boca fechada... não convence. Boca aberta... melhor não.",
  "Ele foi atrás de um dentista profissional pra resolver tudo do jeito certo. Depois da avaliação, o plano ficou claro: clareamento, repor o dente que faltava, e começar o alinhamento.",
  "Primeiro, veio o clareamento. Nada de improvisar em casa: o Roberto deixou essa parte nas mãos de um profissional.",
  "Mas ainda tinha outro problema... faltava um dente! O dentista indicou a prótese certa pro caso dele. E pronto: o espaço sumiu.",
  "E não acabou! Os dentes também precisavam de alinhamento. O aparelho não faz milagre de um dia pro outro, mas o tratamento começou. Agora sim: um sorriso muito mais completo!",
  "Mas não dava pra comemorar ainda. A segunda missão estava esperando... e talvez fosse até pior.",
  "Primeiro, as roupas. Uma camiseta... outra... mais outra. De onde saiu tanta camiseta?",
  "Depois, a mesa. Papel, embalagem, um copo misterioso... e o controle que ele procurava há três semanas!",
  "Lixo fora, cama arrumada, chão limpo... Ele quase desistiu. Respirou fundo... e continuou.",
  "Depois de muito esforço, o Roberto finalmente transformou aquele caos num quarto de verdade!",
  "Mais tarde, chegou uma mensagem da Laura. E dessa vez, o Roberto tinha o que mostrar.",
  "O Roberto ficou vinte minutos encarando essa mensagem. Vinte minutos. Ele simplesmente não conseguia acreditar.",
  "Depois de resolver os dentes e finalmente organizar o quarto, o Roberto começou a sentir os primeiros resultados da mudança.",
  "Ele estava começando a ficar mais confiante... mas ainda faltava muita coisa.",
  "Comenta uma palavra: cabelo, ou skincare? Você decide o futuro do Roberto!"

function closeup(stage,mark,cls=''){$('closeup')?.remove();fx.insertAdjacentHTML('beforeend',`<div class="closeup ${cls}" id="closeup">${bigSmile(stage,mark)}</div>`)}
function closeupHide(){$('closeup')?.remove()}
function clock(label){$('clk')?.remove();fx.insertAdjacentHTML('beforeend',`<div class="clk" id="clk"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#000" stroke-width="7"/>${Array.from({length:12},(_,i)=>`<path d="M50 12 V18" stroke="#000" stroke-width="4" transform="rotate(${i*30} 50 50)"/>`).join('')}<path class="hand fast" d="M50 50 V16" stroke="#e8483b" stroke-width="5" stroke-linecap="round"/><path class="hand slow" d="M50 50 V30" stroke="#000" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="50" r="5"/></svg><span>${label}</span></div>`)}
function clockHide(){$('clk')?.remove()}
function banner(t,cls=''){$('ban')?.remove();if(t)fx.insertAdjacentHTML('beforeend',`<div class="ban ${cls}" id="ban">${t}</div>`)}
function sparkEyes(){fx.insertAdjacentHTML('beforeend',`<div class="spk" style="left:34%;top:66%">✦</div><div class="spk" style="left:55%;top:66%;animation-delay:.2s">✦</div><div class="spk sm" style="left:28%;top:60%;animation-delay:.4s">✦</div><div class="spk sm" style="left:66%;top:61%;animation-delay:.1s">✦</div>`)}
// Glow up animado (sincronizado com o relógio do episódio)
let glow={from:0,to:0,t0:0,d:0};
function glowTo(p,d=2.2){glow={from:curGlow(),to:p,t0:G,d}}
function curGlow(){const k=glow.d?Math.min(1,Math.max(0,(G-glow.t0)/glow.d)):1;const e=1-Math.pow(1-k,3);return glow.from+(glow.to-glow.from)*e}
function hud(){const v=curGlow();$('hudGlow').textContent=Math.round(v)+'%';$('hudBar').style.width=v+'%';$('hudGlowBox').classList.toggle('lit',glow.to>glow.from&&G-glow.t0<glow.d+.8&&G>=glow.t0)}

  [5.2,()=>{camTo(1.2,0,4);setRob('rob','smile',{teeth:'braces',hair:'worse'});cap('PRÓXIMAS <em>MISSÕES!</em>','green')}]]},
// 17 — Votação: CABELO ou SKINCARE
{ dur:7, music:'vote', build:()=>voteScreen(
   `<button class="opt a" data-v="CABELO" aria-label="Votar em Cabelo: um novo corte e um visual mais arrumado"><svg viewBox="25 0 150 205">${robInner('smile',{teeth:'braces',hair:'worse'})}<g class="twinkle tb"><text x="146" y="44" font-size="30">✂️</text></g><text x="28" y="40" font-size="26">💈</text></svg><span class="lab">CABELO</span><span class="desc">Um novo corte e um visual mais arrumado.</span></button>`,
   `<button class="opt b" data-v="SKINCARE" aria-label="Votar em Skincare: uma rotina de cuidados com a pele"><svg viewBox="25 0 150 205">${robInner('smile',{teeth:'braces'})}<g class="twinkle tb"><text x="150" y="60" font-size="26">🧴</text></g><text x="26" y="44" font-size="26">🧼</text><text x="140" y="196" font-size="22">✨</text></svg><span class="lab">SKINCARE</span><span class="desc">Uma rotina de cuidados com a pele.</span></button>`,
   'QUAL SERÁ A PRÓXIMA MISSÃO DO ROBERTO?','COMENTE: CABELO OU SKINCARE?'),
  cues:[[0,()=>{camTo(1,0,0,true);flash();sfx('whoosh');cap('')}],[.4,()=>sfx('sparkle')]]}];
const starts=[];let acc=0;SCENES.forEach(s=>{starts.push(acc);acc+=s.dur});const TOTAL=acc;

/* ================= MOTOR (sem controles: começa sozinho) ================= */
let G=0,cur=-1,playing=false,ended=false,fired=new Set(),last=performance.now(),started=false;
const stage=$('stage');
function loadScene(i){cur=i;G=starts[i];fired=new Set();fx.innerHTML='';layer.innerHTML=SCENES[i].build();narr(i);if(musicMode!==SCENES[i].music){musicMode=SCENES[i].music;step=0}}
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing&&cur>=0){if(narrBusy&&NARRACAO_ARQUIVOS[cur]&&!narrEl.paused&&narrEl.currentTime>0)G=starts[cur]+narrEl.currentTime;else G+=dt;const st=G-starts[cur];SCENES[cur].cues.forEach((c,k)=>{if(!fired.has(k)&&st>=c[0]){fired.add(k);c[1]()}});
    if(st>=SCENES[cur].dur&&!(narrBusy&&st<SCENES[cur].dur+10)){if(cur<SCENES.length-1)loadScene(cur+1);else{playing=false;ended=true;musicMode='vote'}}}
  hud();requestAnimationFrame(tick)}
function play(){if(started)return;started=true;initAudio();loadScene(0);playing=true;musicStart()}
// Toque/clique em qualquer lugar libera o som se o navegador tiver bloqueado o áudio automático
document.addEventListener('pointerdown',()=>{if(ac&&ac.state==='suspended')ac.resume();if(narrBusy&&narrEl.paused&&narrEl.src)narrEl.play().catch(()=>{})},{passive:true});
// Votação: só registra a escolha local de quem assiste (sem placar falso)
layer.addEventListener('click',e=>{const b=e.target.closest('.opt');if(!b||cur!==SCENES.length-1)return;const v=$('vote');v.classList.add('chosen');v.querySelectorAll('.opt').forEach(o=>o.classList.toggle('sel',o===b));
  $('voted').textContent=`Você escolheu: ${b.dataset.v} ✓ — comente essa palavra (dá pra trocar)`;
  sfx('pop');sfx('sparkle');const r=b.getBoundingClientRect(),s=stage.getBoundingClientRect();
  for(let i=0;i<24;i++){const d=document.createElement('i');d.className='conf';d.style.left=(r.left-s.left+r.width/2)+'px';d.style.top=(r.top-s.top+r.height*.45)+'px';d.style.background=['#ffd93b','#3ee36b','#fff','#ff5a4a'][i%4];d.style.setProperty('--dx',(Math.random()*240-120)+'px');d.style.setProperty('--dy',(Math.random()*-260-40)+'px');stage.appendChild(d);setTimeout(()=>d.remove(),1200)}});
window.startEpisode=play;
requestAnimationFrame(tick);
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{if(!window.__noAutoStart)play()});
</script>
